<body bgcolor="#24282e" text="white">
    <h2 align="center">Registration Page</h2>
    <hr>
    <form>
        <table border="0" cellpadding="10" cellspacing="0" align="center">
            <tr>
                <td><font color="white"><b>Full Name:</b></font></td>
                <td><input type="text" name="fullname" size="40"></td>
            </tr>
            <tr>
                <td><font color="white"><b>Email:</b></font></td>
                <td><input type="text" name="email" size="40"></td>
            </tr>
            <tr>
                <td><font color="white"><b>Phone:</b></font></td>
                <td><input type="text" name="phone" size="40"></td>
            </tr>
            <tr>
                <td><font color="white"><b>Course:</b></font></td>
                <td>
                    <select name="course">
                        <option>B.A</option>
                        <option>B.Sc</option>
                        <option>B.Com</option>
                        <option>BCA</option>
                        <option>M.A</option>
                        <option>M.Sc</option>
                        <option>M.Com</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td><font color="white"><b>Gender:</b></font></td>
                <td>
                    <input type="radio" name="gender" value="Male"> <font color="white">Male</font>
                    <input type="radio" name="gender" value="Female"> <font color="white">Female</font>
                    <input type="radio" name="gender" value="Other"> <font color="white">Other</font>
                </td>
            </tr>
            <tr>
                <td><font color="white"><b>Hobbies:</b></font></td>
                <td>
                    <input type="checkbox" name="hobby" value="Sports"> <font color="white">Sports</font>
                    <input type="checkbox" name="hobby" value="Music"> <font color="white">Music</font>
                    <input type="checkbox" name="hobby" value="Reading"> <font color="white">Reading</font>
                    <input type="checkbox" name="hobby" value="Travel"> <font color="white">Travel</font>
                </td>
            </tr>
            <tr>
                <td colspan="2" align="center">
                    <input type="submit" value="Register">
                    <input type="reset" value="Clear">
                </td>
            </tr>
        </table>
    </form>
</body>
